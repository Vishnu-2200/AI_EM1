
<!DOCTYPE html>
<html>
<head>
    <title>Practical 7 - Naive Bayes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Student Performance Prediction</h1>
    <h2>Gaussian Naive Bayes</h2>

    <form method="POST">
        <label>Study Hours Per Day:</label>
        <input type="number" name="hours" min="0" max="24" step="0.5" required>

        <label>Attendance Percentage:</label>
        <input type="number" name="attendance" min="0" max="100" required>

        <label>Previous Marks:</label>
        <input type="number" name="marks" min="0" max="100" required>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
        <h2>Prediction</h2>
        <p>{{ prediction }}</p>
    </div>
    {% endif %}

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
